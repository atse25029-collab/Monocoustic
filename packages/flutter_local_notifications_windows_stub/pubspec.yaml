name: flutter_local_notifications_windows
description: Pure Dart stub for Windows without ATL dependencies
version: 3.1.1

environment:
  sdk: ^3.10.0
  flutter: ">=3.38.1"

dependencies:
  flutter:
    sdk: flutter
  flutter_local_notifications_platform_interface: ^12.0.0
  timezone: ^0.11.0

flutter:
  plugin:
    implements: flutter_local_notifications
    platforms:
      windows:
        dartPluginClass: FlutterLocalNotificationsWindows
