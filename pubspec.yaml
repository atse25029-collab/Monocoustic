name: monocoustic
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  audioplayers: ^6.8.1
  file_picker: ^13.1.0
  provider: ^6.1.5+1
  qr_flutter: ^4.1.0
  web_socket_channel: ^3.0.3
  intl: ^0.20.3
  path: ^1.9.1
  mobile_scanner: ^7.4.2
  shared_preferences: ^2.5.6
  window_manager: ^0.5.2
  wakelock_plus: ^1.8.2
  flutter_local_notifications: ^22.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

dependency_overrides:
  flutter_local_notifications_windows:
    path: packages/flutter_local_notifications_windows_stub

flutter:
  uses-material-design: true

  assets:
    - assets/
